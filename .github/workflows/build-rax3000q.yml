name: Build RAX3000Q (patch + build, no plugins)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ===== 1. 移植 RAX3000Q 支持（设备树 + WiFi 校准）=====
    - name: Download RAX3000Q files
      run: |
        mkdir -p target/linux/qualcommax/files/arch/arm64/boot/dts/qcom
        mkdir -p package/firmware/ipq-wifi/files
        BASE=https://raw.githubusercontent.com/amaxsky/openwrt-25.12.0-rc3_rax3000q/main
        curl -fsSL -o target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq5018-rax3000q.dts \
          $BASE/target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq5018-rax3000q.dts
        curl -fsSL -o package/firmware/ipq-wifi/files/board-cmcc_rax3000q.ipq5018 \
          $BASE/package/firmware/ipq-wifi/files/board-cmcc_rax3000q.ipq5018
        curl -fsSL -o package/firmware/ipq-wifi/files/board-cmcc_rax3000q.qcn6122 \
          $BASE/package/firmware/ipq-wifi/files/board-cmcc_rax3000q.qcn6122

    - name: Patch device definition (ipq50xx.mk)
      run: |
        cat >> target/linux/qualcommax/image/ipq50xx.mk <<'EOF'

        define Device/cmcc_rax3000q
        	$(call Device/FitImageLzma)
        	$(call Device/UbiFit)
        	DEVICE_VENDOR := CMCC
        	DEVICE_MODEL := RAX3000Q
        	DEVICE_DTS_CONFIG := config@mp02.1
        	SOC := ipq5018
        	BLOCKSIZE := 128k
        	PAGESIZE := 2048
        	IMAGE_SIZE := 59392k
        	NAND_SIZE := 128m
        	DEVICE_PACKAGES := \
        		ath11k-firmware-ipq5018-qcn6122 \
        		ipq-wifi-cmcc_rax3000q
        endef
        TARGET_DEVICES += cmcc_rax3000q
        EOF

    - name: Patch ipq-wifi Makefile
      run: |
        python3 - <<'EOF'
        p='package/firmware/ipq-wifi/Makefile'
        s=open(p).read()
        if 'cmcc_rax3000q' not in s:
            s=s.replace('cmcc_mr3000d-ci \\','cmcc_mr3000d-ci \\\ncmcc_rax3000q \\',1)
            s+='$(eval $(call generate-ipq-wifi-package,cmcc_rax3000q,CMCC RAX3000Q))\n'
        open(p,'w').write(s)
        EOF

    # ===== 2. 编译环境 =====
    - name: Cache dl
      uses: actions/cache@v4
      with:
        path: dl
        key: dl-cache

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}
        restore-keys: ccache-

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync unzip zlib1g-dev file wget ccache

    - name: Update & install feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ===== 3. 生成配置（不带插件）=====
    - name: Generate config
      run: |
        rm -f .config
        echo "CONFIG_TARGET_qualcommax=y" >> .config
        echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
        echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_cmcc_rax3000q=y" >> .config
        make defconfig

    # ===== 4. 编译 =====
    - name: Build firmware
      run: |
        make -j$(nproc) || make -j1 V=s

    # ===== 5. 发布 Release =====
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: rax3000q-${{ github.run_id }}
        name: RAX3000Q Firmware (build ${{ github.run_id }})
        body: |
          ImmortalWrt 25.12 (kernel 6.12) CMCC RAX3000Q 固件（无插件）
        files: bin/targets/qualcommax/ipq50xx/*
        draft: false
        prerelease: false
