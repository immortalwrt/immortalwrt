name: Build RAX3000Q
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache dl
      uses: actions/cache@v4
      with:
        path: dl
        key: dl-cache

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}
        restore-keys: ccache-

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync unzip zlib1g-dev file wget ccache

    - name: Update & install feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate config for RAX3000Q
      run: |
        rm -f .config
        echo "CONFIG_TARGET_qualcommax=y" >> .config
        echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
        echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_cmcc_rax3000q=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-nikki=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_rtp2httpd=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-rtp2httpd=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-rtp2httpd-zh-cn=y" >> .config
        make defconfig

    - name: Build firmware
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: rax3000q-${{ github.run_id }}
        name: RAX3000Q Firmware (build ${{ github.run_id }})
        body: |
          ImmortalWrt 25.12 (kernel 6.12) CMCC RAX3000Q 固件
          含 nikki + rtp2httpd
        files: bin/targets/qualcommax/ipq50xx/*
        draft: false
        prerelease: false
